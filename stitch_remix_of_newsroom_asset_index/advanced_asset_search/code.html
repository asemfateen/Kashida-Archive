<!DOCTYPE html>

<body class="bg-surface-bright text-on-surface h-full overflow-hidden flex flex-col font-body-md">
<!-- TopNavBar -->

<div class="flex items-center gap-6">
<span class="font-headline-md text-headline-md text-primary tracking-tight font-bold">NewsLens</span>
</div>
<div class="flex-1 max-w-2xl mx-12">
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-container-low border border-transparent group-focus-within:border-primary group-focus-within:bg-surface-container-lowest rounded-full py-2 pl-10 pr-12 outline-none transition-colors font-body-md text-on-surface" placeholder="Search assets..." type="text" value="politics + crowd + 2024"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1 opacity-50 group-focus-within:opacity-100 transition-opacity">
<span class="font-mono-data text-mono-data bg-surface-variant px-1.5 py-0.5 rounded text-xs">⌘</span>
<span class="font-mono-data text-mono-data bg-surface-variant px-1.5 py-0.5 rounded text-xs">K</span>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<button class="bg-primary text-on-primary px-4 py-2 rounded font-title-sm text-title-sm hover:opacity-90 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined">upload</span>

            </button>
<div class="flex gap-2 text-on-surface-variant">
<button aria-label="Notifications" class="p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button aria-label="Settings" class="p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>

<div class="flex items-center justify-between mb-4">
<h2 class="font-title-sm text-title-sm text-primary">Advanced Filters</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors text-sm underline font-body-sm">Clear All</button>
</div>
<button class="w-full flex items-center justify-center gap-2 border border-outline hover:border-primary text-primary py-2 rounded transition-colors font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[18px]">bookmark_add</span>
                    Save Search
                </button>
</div>
<!-- Filter Sections -->
<div class="p-6 space-y-8 flex-1">
<!-- Date Range -->
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-3 uppercase">Date Range</h3>
<div class="space-y-3">
<label class="flex items-center gap-3">
<input class="form-radio text-primary focus:ring-primary border-outline" name="date" type="radio"/>
<span class="font-body-sm text-body-sm">Past 24 Hours</span>
</label>
<label class="flex items-center gap-3">
<input class="form-radio text-primary focus:ring-primary border-outline" name="date" type="radio"/>
<span class="font-body-sm text-body-sm">Past Week</span>
</label>
<label class="flex items-center gap-3">
<input checked="" class="form-radio text-primary focus:ring-primary border-outline" name="date" type="radio"/>

</label>
<div class="pl-7 flex gap-2">

<input class="w-full bg-surface-container-low border border-outline-variant rounded px-2 py-1 text-xs font-mono-data" placeholder="End" type="text" value="Present"/>
</div>
</div>
</div>

<div>

<label class="flex items-center gap-3">
<input checked="" class="form-checkbox text-primary rounded-sm focus:ring-primary border-outline" type="checkbox"/>

</label>
<label class="flex items-center gap-3">
<input checked="" class="form-checkbox text-primary rounded-sm focus:ring-primary border-outline" type="checkbox"/>
<span class="font-body-sm text-body-sm">RAW</span>
</label>
<label class="flex items-center gap-3">
<input class="form-checkbox text-primary rounded-sm focus:ring-primary border-outline" type="checkbox"/>
<span class="font-body-sm text-body-sm">PNG</span>
</label>
</div>
</div>
</div>

<div class="flex gap-2 mt-2">
<span class="bg-primary-container text-on-primary-fixed-variant px-2 py-1 rounded text-xs font-mono-data flex items-center gap-1 border border-primary-fixed">politics <button class="hover:text-primary"><span class="material-symbols-outlined text-[14px]">close</span></button></span>

<button class="bg-surface-container-lowest/80 backdrop-blur-sm p-1.5 rounded hover:bg-surface-container-lowest text-on-surface-variant hover:text-primary shadow-sm"><span class="material-symbols-outlined text-[18px]">download</span></button>
</div>

<div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/80 to-transparent flex flex-wrap gap-1.5">

<span class="bg-primary text-on-primary text-[10px] px-1.5 py-0.5 rounded font-mono-data font-bold border border-primary-fixed">crowd</span>

</div>
<div class="p-3 bg-surface-container-lowest shrink-0 border-t border-outline-variant">
<div class="flex justify-between items-start mb-1">

<div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/80 to-transparent flex flex-wrap gap-1.5">
<span class="bg-primary text-on-primary text-[10px] px-1.5 py-0.5 rounded font-mono-data font-bold border border-primary-fixed">crowd</span>
<span class="bg-surface-container text-on-surface-variant text-[10px] px-1.5 py-0.5 rounded font-mono-data">reaction</span>
</div>
</div>
</div>
</div>
</div>

<div class="absolute bottom-0 left-0 right-0 bg-surface-container-lowest border-t border-outline-variant px-margin-page py-3 flex items-center gap-4 shadow-[0_-10px_15px_rgba(0,0,0,0.02)] z-20">
<span class="font-label-caps text-label-caps text-on-surface-variant w-16">TIMELINE</span>
<div class="flex-1 relative h-6 group">
<!-- Fake timeline track -->
<div class="absolute top-1/2 -translate-y-1/2 left-0 right-0 h-1 bg-surface-container-high rounded"></div>

<div class="absolute bottom-2 left-[11%] w-1 h-4 bg-primary-fixed-dim rounded-t opacity-50"></div>
<div class="absolute bottom-2 left-[12%] w-1 h-2 bg-primary-fixed-dim rounded-t opacity-50"></div>
<div class="absolute bottom-2 left-[45%] w-1 h-5 bg-primary-fixed-dim rounded-t opacity-80"></div>
<div class="absolute bottom-2 left-[46%] w-1 h-6 bg-primary-fixed-dim rounded-t opacity-80"></div>
<div class="absolute bottom-2 left-[47%] w-1 h-8 bg-primary-fixed rounded-t"></div>
<div class="absolute bottom-2 left-[48%] w-1 h-7 bg-primary-fixed rounded-t"></div>
<div class="absolute bottom-2 left-[49%] w-1 h-5 bg-primary-fixed rounded-t"></div>

<div class="absolute top-1/2 -translate-y-1/2 left-[47%] w-3 h-3 bg-primary rounded-full shadow cursor-pointer group-hover:scale-125 transition-transform border-2 border-surface-container-lowest"></div>
</div>
<span class="font-mono-data text-mono-data text-primary w-24 text-right">Oct 2024</span>
</div>
