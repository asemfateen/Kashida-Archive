<body class="bg-background text-on-background font-body-md text-body-md h-screen overflow-hidden flex flex-col">
<!-- TopNavBar (Shared Component) -->
<nav class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center w-full px-margin-page py-unit h-16 z-50">
<div class="flex items-center gap-gutter">

<input class="bg-transparent border-none outline-none text-body-sm text-on-surface w-64 placeholder-on-surface-variant focus:ring-0 p-0" placeholder="Search assets... (Cmd+K)" type="text">
</div>
</div>
<div class="flex items-center gap-gutter">
<div class="flex gap-4">
<a class="text-on-surface-variant hover:bg-surface-container transition-colors p-2 rounded-full flex items-center justify-center scale-95 active:opacity-80 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container transition-colors p-2 rounded-full flex items-center justify-center scale-95 active:opacity-80 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</a>
</div>
<button class="bg-tertiary text-on-tertiary font-label-caps text-label-caps px-4 py-2 rounded-DEFAULT hover:bg-tertiary-container transition-colors">Upload</button>

<div class="flex flex-1 overflow-hidden">
<!-- Main Content Canvas (Asset View) -->
<main class="flex-1 bg-surface-bright flex flex-col relative">
<!-- Asset Toolbar -->
<div class="h-12 border-b border-outline-variant bg-surface-container-lowest flex items-center justify-between px-margin-page">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-on-surface flex items-center gap-1 transition-colors">
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
<span class="font-label-caps text-label-caps">Back to Grid</span>
</button>
<div class="w-px h-4 bg-outline-variant"></div>
<span class="font-mono-data text-mono-data text-secondary">DSC_0492_ELECTION_2024.RAW</span>
</div>
<div class="flex items-center gap-2">
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-container text-on-surface-variant transition-colors" title="Previous Asset (Left Arrow)">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<span class="font-mono-data text-mono-data text-secondary px-2">42 / 1024</span>
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-container text-on-surface-variant transition-colors" title="Next Asset (Right Arrow)">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
<!-- Image Viewer -->
<div class="flex-1 p-margin-page flex items-center justify-center bg-background overflow-hidden">
<div class="relative w-full h-full flex items-center justify-center">
<img alt="Current Asset" class="max-w-full max-h-full object-contain shadow-sm border border-outline-variant rounded-DEFAULT bg-surface-container-lowest" data-alt="A high-resolution photojournalistic image capturing a large, intense political protest outside a grand, neoclassical capitol building. The lighting is harsh daylight, casting sharp shadows. The crowd is dense, holding signs, with a clear focus on a central figure passionately speaking. The overall tone is urgent, authoritative, and historically significant, typical of front-page news photography in a modern light-mode editorial context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7GapH3m_JUBRzbF9iI2FgpaMIJD-30ESi1Zzm5BtT5tFwSSkR3I2irz2dpIkuXAoNmqKcr6aiwYiJrnPFrlVEtbt_5jnCltmBplMsBNrC0Cycph8jkh8FdPvDh_AuwAKQAWuDG8TGqBj0CEDiCIXvu2X19xUAAIq3wvNrmWUjvxDJceNXm5GfgFPaEv2WAOUMIyL6O-LlcwiPgAqtO0m6vhVUDUVN3ee84J1hQDtUSUSR5_l1QRaMgw">

<button class="p-2 hover:bg-surface-container text-on-surface-variant transition-colors border-r border-outline-variant"><span class="material-symbols-outlined" style="font-size: 20px;">zoom_out</span></button>
<button class="p-2 hover:bg-surface-container text-on-surface-variant transition-colors border-r border-outline-variant"><span class="font-mono-data text-mono-data px-2">Fit</span></button>
<button class="p-2 hover:bg-surface-container text-on-surface-variant transition-colors"><span class="material-symbols-outlined" style="font-size: 20px;">zoom_in</span></button>
</div>
</div>
</div>
<!-- Quick Action Bar -->
<div class="h-12 border-t border-outline-variant bg-surface-container-lowest flex items-center justify-center gap-6">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">star</span>
<span class="font-label-caps text-label-caps">Favorite</span>
</button>
<div class="w-px h-4 bg-outline-variant"></div>
<button class="flex items-center gap-2 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">download</span>
<span class="font-label-caps text-label-caps">Download High-Res</span>
</button>
<div class="w-px h-4 bg-outline-variant"></div>
<button class="flex items-center gap-2 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">delete</span>
<span class="font-label-caps text-label-caps">Move to Trash</span>
</button>
</div>

<!-- Metadata & Tagging Panel (Fixed Right Sidebar) -->
<aside class="w-panel-width-fixed bg-surface-container-lowest border-l border-outline-variant flex flex-col h-full overflow-y-auto">
<div class="p-4 border-b border-outline-variant bg-surface-container-low flex justify-between items-center sticky top-0 z-10">

<button class="text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined" style="font-size: 20px;">more_horiz</span></button>
</div>

<div class="flex justify-between items-end mb-2">

</div>
<!-- Existing Tags (Chips) -->
<div class="flex flex-wrap gap-2 mb-3">
<span class="inline-flex items-center gap-1 bg-surface-container-high border border-outline-variant text-on-surface font-body-sm text-body-sm px-2.5 py-1 rounded-full">
                            Elections 2024
                            <button class="text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined" style="font-size: 14px;">close</span></button>
</span>
<span class="inline-flex items-center gap-1 bg-surface-container-high border border-outline-variant text-on-surface font-body-sm text-body-sm px-2.5 py-1 rounded-full">
                            Capitol
                            <button class="text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined" style="font-size: 14px;">close</span></button>
</span>
<span class="inline-flex items-center gap-1 bg-surface-container-high border border-outline-variant text-on-surface font-body-sm text-body-sm px-2.5 py-1 rounded-full">
                            Protest
                            <button class="text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined" style="font-size: 14px;">close</span></button>
</span>
<span class="inline-flex items-center gap-1 bg-surface-container-high border border-outline-variant text-on-surface font-body-sm text-body-sm px-2.5 py-1 rounded-full">
                            Washington D.C.
                            <button class="text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined" style="font-size: 14px;">close</span></button>
</span>
</div>
<!-- Auto-suggest Input -->
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT px-3 py-2 text-body-sm text-on-surface focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container outline-none transition-colors" placeholder="Add tags..." type="text">
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant" style="font-size: 16px;">add</span>
</div>
</section>
<hr class="border-outline-variant">
<!-- Structured Data Section -->
<section class="flex flex-col gap-4">
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-1">File Details</h3>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-secondary">Original Filename</label>
<div class="flex items-center justify-between">
<span class="font-mono-data text-mono-data text-on-surface truncate">DSC_0492_ELECTION_2024.RAW</span>
<button class="text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined" style="font-size: 16px;">content_copy</span></button>
</div>
</div>
<div class="flex flex-col gap-1">


</div>
<div class="flex flex-col gap-1">


</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-secondary">Date added</label>
<span class="font-mono-data text-mono-data text-on-surface">2024-11-06T14:32:01Z</span>
</div>

</section>
<hr class="border-outline-variant">
<!-- Quick Apply Actions -->
<section class="flex flex-col gap-2 pb-8">

<div class="grid grid-cols-2 gap-2">


</div>
</section>
</div>
</aside>
</div>
